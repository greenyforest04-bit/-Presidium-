[package]
name = "presidium-proto"
version = "0.1.0"
edition = "2021"
description = "Protobuf definitions and generated types for Presidium"
license = "GPL-3.0-only"
authors = ["Sergey Presidium <presidium_messanger@internet.ru>"]

[features]
default = ["std"]
std = []

[dependencies]
prost = { workspace = true }
prost-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }

[lib]
name = "presidium_proto"
crate-type = ["cdylib", "rlib", "staticlib"]