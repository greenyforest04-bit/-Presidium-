[package]
name = "presidium-crypto"
version = "0.1.0"
edition = "2021"
description = "PQXDH + Double Ratchet cryptography for Presidium"
license = "GPL-3.0-only"
authors = ["Sergey Presidium <presidium_messanger@internet.ru>"]
repository = "https://github.com/presidium/messenger"
categories = ["cryptography", "network-programming"]
keywords = ["pqxdh", "double-ratchet", "signal", "e2ee", "post-quantum"]

[features]
default = ["std"]
std = []
bindings = ["uniffi"]

[dependencies]
# Post-Quantum Cryptography
ml-kem = { version = "0.3", features = ["zeroize"] }
ml-dsa = { version = "0.1", features = ["zeroize", "rand_core"] }
kem = "0.3"

# Classical Cryptography
x25519-dalek = { version = "3.0", features = ["static_secrets", "reusable_secrets", "getrandom", "serde", "zeroize"] }
ed25519-dalek = { version = "3.0", features = ["rand_core", "serde", "alloc"] }
chacha20poly1305 = "0.11"
aes-gcm = "0.11"
hkdf = "0.13"
sha2 = "0.11"
hmac = "0.13"

# Random & Safety
rand = { version = "0.10", features = ["std", "std_rng", "sys_rng", "thread_rng"] }
zeroize = { version = "1.9", features = ["derive"] }
zeroize_derive = "1.4"
memguard = "0.1"
subtle = "2.6"
constant_time_eq = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
serde_bytes = "0.11"
bytes = "1.6"

# Protobuf
prost = "0.14"
prost-types = "0.14"

# Utils
anyhow = "1.0"
thiserror = "2.0"
ulid = "3.0"
hex = "0.4"
base64 = "0.23"

# FFI
uniffi = { version = "0.32", features = ["tokio"], optional = true }
uniffi_macros = { version = "0.32", optional = true }

[dev-dependencies]
proptest = "1.0"
hex-literal = "0.4"

[lib]
name = "presidium_crypto"
crate-type = ["cdylib", "rlib", "staticlib"]

[build-dependencies]
uniffi_build = { version = "0.32", optional = true }