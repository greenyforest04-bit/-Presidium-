[package]
name = "presidium-media"
version = "0.1.0"
edition = "2021"
description = "Encrypted media handling (audio, video circles, thumbnails) for Presidium"
license = "GPL-3.0-only"
authors = ["Sergey Presidium <presidium_messanger@internet.ru>"]

[features]
default = ["std"]
std = []

[dependencies]
presidium-crypto = { path = "../presidium-crypto" }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

[lib]
name = "presidium_media"
crate-type = ["cdylib", "rlib", "staticlib"]